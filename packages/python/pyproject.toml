[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "contract-entitlement"
version = "1.0.0"
description = "Convert contracts and order forms into machine-readable entitlements, obligations, renewals, usage limits and commercial commitments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "API Disk Integrations" }]
keywords = ["api", "sdk", "contract-entitlement"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[tool.hatch.build]
ignore-vcs = true

[project.urls]
Homepage = "https://contractentitlement-api.com/"
Documentation = "https://contractentitlement-api.com/#docs"
Pricing = "https://contractentitlement-api.com/#pricing"
Privacy = "https://contractentitlement-api.com/privacy"
Terms = "https://contractentitlement-api.com/terms"
Source = "https://github.com/API-Disk-Integrations/contract-entitlement"
Issues = "https://github.com/API-Disk-Integrations/contract-entitlement/issues"
Changelog = "https://github.com/API-Disk-Integrations/contract-entitlement/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_entitlement"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/contract_entitlement/__init__.py",
]
